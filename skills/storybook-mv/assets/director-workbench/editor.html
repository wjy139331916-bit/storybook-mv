<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MV 导演工作台</title>
<style>
:root{--ink:#253a43;--muted:#73807f;--line:#dfe5df;--paper:#f3f4ee;--accent:#3f7772;--soft:#e8f0e9;--warn:#a65c40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary,button.active{background:var(--accent);color:white;border-color:var(--accent)}button:hover{filter:brightness(.97)}textarea{width:100%;min-height:74px;resize:vertical}header{padding:20px 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0;letter-spacing:-.5px}h2{font-size:16px;margin:0 0 15px}h3{font-size:14px;margin:18px 0 10px}p{margin:5px 0}.sub{font-size:12px;color:var(--muted)}.tag{padding:5px 10px;background:var(--soft);color:var(--accent);border-radius:20px;font-size:12px;display:inline-block}.toolbar{max-width:1480px;margin:auto;padding:14px 24px;display:flex;gap:8px;flex-wrap:wrap}.layout{max-width:1480px;margin:auto;padding:0 24px 24px;display:grid;grid-template-columns:minmax(420px,1.4fr) minmax(340px,1fr);gap:20px;align-items:start}.panel{padding:20px;background:#fff;border:1px solid var(--line);border-radius:15px;min-width:0}.preview{position:sticky;top:14px}.stage{border-radius:10px;overflow:hidden;background:#e9ede7;line-height:0}.stage canvas{width:100%;height:auto;display:block;touch-action:none}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.spread{justify-content:space-between}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0}.file-field{display:block}.file-field>span{display:block;margin-bottom:6px}.field>span{color:var(--muted);font-size:13px;flex:1}.field input,.field select{width:145px}.field input[type=checkbox]{width:auto}.field textarea{width:65%}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;flex:none}.list{display:grid;gap:8px;margin:12px 0}.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcf9;overflow-wrap:anywhere}.card.selected{border-color:#81a9a0;background:#eef4ed}.card button{padding:5px 9px;font-size:12px}.card strong{font-size:13px}.notice{background:#f5f2e7;border-left:3px solid #c4b37b;border-radius:6px;padding:10px 12px;font-size:12px;color:#77674f}.error{color:#b4513d}.ok{color:#3d7b65}#status{min-height:22px;margin:10px 0;overflow-wrap:anywhere}.track{position:relative;height:54px;background:#f2f5ef;border-radius:9px;overflow:hidden;margin:8px 0}.track button{position:absolute;top:8px;height:36px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#dbe9e0;border-color:#9bbbac;padding:4px;min-width:10px;font-size:11px;touch-action:none}.track button.selected{background:#3f7772;color:white}.track .playhead{position:absolute;top:0;bottom:0;width:2px;background:#b56b46;pointer-events:none}#wave{width:100%;height:75px;display:block;border-radius:7px;background:#f2f4ef;touch-action:none}input[type=range]{padding:0;accent-color:var(--accent)}#time{flex:1;min-width:100px}audio,video{width:100%;border-radius:8px}video{background:#1c292b;max-height:240px}.video-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.video-grid:has(video[hidden]){grid-template-columns:1fr}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;touch-action:none}.scroll{max-height:260px;overflow:auto}.small{font-size:12px}hr{border:0;border-top:1px solid var(--line);margin:17px 0}.hidden{display:none!important}#scope{max-width:600px}.binding{font-family:ui-monospace,monospace;font-size:11px;overflow-wrap:anywhere}footer{max-width:1480px;margin:auto;padding:0 25px 25px;color:var(--muted);font-size:12px}input[type=color]{padding:3px;width:48px;height:34px}input[type=file]{width:100%}@media(max-width:1000px){.layout{grid-template-columns:1fr}.preview{position:relative;top:0}.toolbar{padding:12px}.layout{padding:0 12px 16px}}@media(max-width:520px){header{padding:15px;display:block}h1{font-size:21px}header .tag{margin-top:9px}.panel{padding:15px}.two{grid-template-columns:1fr}.field input,.field select{width:138px}.video-grid{grid-template-columns:1fr}.toolbar button{padding:7px 9px;font-size:12px}}
</style>
<header><div><div class="sub">STORYBOOK MV · 制作工具</div><h1>MV 导演工作台</h1><p class="sub">同一份角色、镜头与歌词数据 · 七个制作模块</p></div><div><span class="tag" id="phase"></span><p class="sub" id="scope"></p></div></header>
<div class="toolbar"><button class="primary" id="save">保存工作台 JSON</button><button id="load">重新载入 JSON</button><button id="undo">撤销</button><button id="redo">重做</button><button id="png">导出当前静帧</button><button id="export">导出草稿包</button><input id="model-file" type="file" accept=".json" hidden></div>
<main class="layout">
<section class="panel preview"><div class="row spread"><h2 id="preview-title">当前镜头</h2><label class="small"><input type="checkbox" id="guides" checked> 显示锚点与接触线</label></div><div class="stage"><canvas id="stage"></canvas></div><div id="status" class="sub" aria-live="polite"></div><div class="row"><button id="play">播放范围</button><input id="time" type="range" min="0" step=".033333" value="0"><input id="seconds" aria-label="全局时间" type="number" min="0" step=".033333" value="0" style="width:100px"><span class="sub">秒</span></div><div id="findings" class="small"></div><hr><canvas id="wave" width="900" height="75" aria-label="实际录音波形"></canvas><audio id="audio" controls hidden></audio><p class="sub" id="audio-hint">可在歌词模块载入所选录音；波形仅表示能量。</p><div class="notice" id="stage-notice"></div></section>
<section class="panel"><nav class="tabs" id="tabs" aria-label="工作台模块"></nav><div id="controls"></div></section>
</main><footer>编辑结果为草稿。作品验收沿用设计稿 → 样片 → 全曲粗剪 → 成片流程。页面不会修改项目阶段或生成使用者同意记录。</footer>
