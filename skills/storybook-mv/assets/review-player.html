<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; img-src blob: data:; connect-src 'none'">
<title>MV 看片与反馈</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#161c24;color:#edf0f3}*{box-sizing:border-box}body{max-width:1400px;margin:0 auto;padding:20px}h1{font-size:22px;margin:0 0 8px}p{color:#bac5d0;font-size:14px;line-height:1.6}label,button,input,textarea,select{font:inherit}button,select,input[type=number]{border:1px solid #596879;border-radius:7px;background:#263444;color:#fff;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:12px}video{width:100%;aspect-ratio:16/9;background:#080c11;border-radius:10px;object-fit:contain}figure{margin:0}figcaption{font-size:13px;color:#b9c8d7;margin:6px 0}#seek{width:100%}textarea{width:100%;min-height:80px;resize:vertical;background:#202d3b;color:#fff;border:1px solid #596879;border-radius:8px;padding:12px}#notes{padding:0;list-style:none}#notes li{padding:10px;border-bottom:1px solid #384557;display:flex;gap:12px;align-items:center}#notes span{flex:1;white-space:pre-wrap}small{color:#aab9c7}.file{border:1px dashed #596879;padding:12px;border-radius:8px;flex:1;min-width:240px}input[type=file]{display:block;max-width:100%;margin-top:7px}#state{color:#e9c77d}#fps{width:75px}</style></head><body>
<h1>MV 看片与反馈</h1><p>选择本地视频，定位需要修改的时间，导出反馈。对照视频同步播放并静音。文件保留在设备上。</p>
<div class="row"><label class="file">当前版本<input id="fileA" type="file" accept="video/*"></label><label class="file">参考或上一版本（可选）<input id="fileB" type="file" accept="video/*"></label></div>
<p id="state">等待选择视频。</p><div class="screens"><figure><video id="a" playsinline preload="metadata"></video><figcaption id="nameA">当前版本</figcaption></figure><figure id="compare" hidden><video id="b" playsinline muted preload="metadata"></video><figcaption id="nameB">对照版本</figcaption></figure></div>
<div class="row"><button id="play" disabled>播放 / 暂停</button><button id="prev" disabled>前一帧</button><button id="next" disabled>后一帧</button><label>帧率 <input id="fps" type="number" value="24" min="1" max="120" step="any"></label><strong id="clock">0.000 秒</strong></div>
<input id="seek" type="range" value="0" min="0" max="1" step="0.001" disabled aria-label="视频时间">
<div class="row"><button id="setIn" disabled>设为片段起点</button><button id="setOut" disabled>设为片段终点</button><label><input id="loop" type="checkbox">循环片段</label><small id="range">尚未选定片段</small></div>
<textarea id="comment" placeholder="例如：接过物件之前，手已经离开；这里的字幕挡住了脸。"></textarea>
<div class="row"><label>程度 <select id="severity"><option value="major">需要修改</option><option value="minor">细节建议</option><option value="blocker">阻止交付</option></select></label><button id="add" disabled>记录当前时间 / 片段</button><button id="export" disabled>导出反馈 JSON</button><label>导入已有反馈<input id="import" type="file" accept="application/json,.json"></label></div>
<ul id="notes"></ul><p>记录用于表达修改意见。逐帧定位受视频编码影响，最终应由制作工具核对；播放器不会自动判定画面质量或修改项目。</p>
<script>
'use strict';
const $=id=>document.getElementById(id),a=$('a'),b=$('b'),notes=[];
const state={a:null,b:null,in:null,out:null,urls:{},generation:{a:0,b:0}};
function fps(){const n=Number($('fps').value);return Number.isFinite(n)&&n>=1&&n<=120?n:24;}
function ready(){$('add').disabled=!(state.a&&Number.isFinite(a.duration)&&a.duration>0);$('export').disabled=!state.a;}
function update(){if(Number.isFinite(a.duration)){$('seek').value=a.currentTime;$('clock').textContent=a.currentTime.toFixed(3)+' 秒 · 第 '+Math.floor(a.currentTime*fps())+' 帧';}if(state.in!==null)$('range').textContent=state.in.toFixed(3)+' — '+(state.out===null?'…':state.out.toFixed(3))+' 秒';}
function seek(t){if(!Number.isFinite(a.duration))return;a.currentTime=Math.max(0,Math.min(a.duration,t));if(state.b&&Number.isFinite(b.duration))b.currentTime=Math.min(a.currentTime,b.duration);update();}
async function load(file,key){if(!file)return;const gen=++state.generation[key];state[key]=null;if(state.urls[key])URL.revokeObjectURL(state.urls[key]);const v=$(key);v.pause();state.urls[key]=URL.createObjectURL(file);v.src=state.urls[key];$('name'+key.toUpperCase()).textContent=file.name;if(key==='b')$('compare').hidden=false;if(key==='a'){notes.length=0;state.in=null;state.out=null;draw();$('export').disabled=true;$('add').disabled=true;}$('state').textContent='正在校验所选文件…';try{const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());if(gen!==state.generation[key])return;state[key]={name:file.name,bytes:file.size,sha256:Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')};$('state').textContent='文件已就绪，可以看片和记录反馈。';ready();}catch(e){$('state').textContent='当前浏览器无法计算文件校验值，反馈导出暂不可用。';}}
$('fileA').onchange=e=>load(e.target.files[0],'a');$('fileB').onchange=e=>load(e.target.files[0],'b');
a.onloadedmetadata=()=>{$('seek').max=a.duration;for(const id of ['play','prev','next','seek','setIn','setOut'])$(id).disabled=false;ready();update();};
$('play').onclick=async()=>{if(a.paused){await a.play();if(state.b)await b.play().catch(()=>{});}else{a.pause();b.pause();}};
$('prev').onclick=()=>{a.pause();b.pause();seek(a.currentTime-1/fps());};$('next').onclick=()=>{a.pause();b.pause();seek(a.currentTime+1/fps());};$('seek').oninput=()=>seek(Number($('seek').value));
$('setIn').onclick=()=>{state.in=a.currentTime;state.out=null;update();};$('setOut').onclick=()=>{if(state.in===null||a.currentTime<=state.in){$('state').textContent='请先设置较早的起点。';return;}state.out=a.currentTime;update();};
function draw(){$('notes').replaceChildren();for(const n of notes){const li=document.createElement('li'),jump=document.createElement('button'),span=document.createElement('span'),remove=document.createElement('button');jump.textContent=n.range.map(x=>x.toFixed(3)).join(' — ')+' 秒';jump.onclick=()=>seek(n.range[0]);span.textContent=n.observation;remove.textContent='删除';remove.onclick=()=>{notes.splice(notes.indexOf(n),1);draw();};li.append(jump,span,remove);$('notes').append(li);}}
$('add').onclick=()=>{const observation=$('comment').value.trim();if(!observation||!state.a||!Number.isFinite(a.duration))return;const end=Math.min(a.duration,a.currentTime+1/fps()),range=state.in!==null&&state.out!==null?[state.in,state.out]:[Math.max(0,Math.min(a.currentTime,a.duration-1/fps())),end];notes.push({id:'viewer-'+crypto.randomUUID(),range,severity:$('severity').value,category:'viewer_feedback',observation});$('comment').value='';draw();};
$('export').onclick=()=>{if(!state.a)return;if(!$('fps').checkValidity()){$('state').textContent='请输入 1—120 之间的实际帧率。';return;}const result={schema_version:1,target:state.a,comparison:state.b,fps:fps(),notes,scope:'Viewer observations; not automatic review passes or source-code diagnoses.'};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='review-notes.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!state.a||obj.target?.sha256!==state.a.sha256)throw Error('反馈对应的视频与当前文件不一致。');if(!Array.isArray(obj.notes)||obj.notes.some(n=>!n.id||typeof n.observation!=='string'||!Array.isArray(n.range)||n.range.length!==2||n.range.some(x=>!Number.isFinite(x))||n.range[0]<0||n.range[1]<=n.range[0]||n.range[1]>a.duration+.1))throw Error('反馈格式或时间范围无效。');for(const n of obj.notes)if(!notes.some(old=>old.id===n.id))notes.push(n);draw();}catch(err){$('state').textContent=err.message;}};
a.onpause=()=>b.pause();
function tick(){if(!a.paused){if($('loop').checked&&state.in!==null&&state.out!==null&&a.currentTime>=state.out)seek(state.in);if(state.b&&Number.isFinite(b.duration)&&Math.abs(b.currentTime-a.currentTime)>.1)b.currentTime=Math.min(a.currentTime,b.duration);}update();requestAnimationFrame(tick);}tick();
</script></body></html>
