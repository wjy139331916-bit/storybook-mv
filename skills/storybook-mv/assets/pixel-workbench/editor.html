<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data: blob:;connect-src 'none'"><title>像素角色工作台</title><style>
:root{color-scheme:light;--ink:#263a43;--muted:#758086;--line:#e3e6e1;--paper:#f5f5f0;--accent:#3d7271}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,select,input{font:inherit}button,select,input[type=number]{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:8px 11px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active,button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:hover:not(:disabled){filter:brightness(.96)}header{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}h1{margin:0;font-size:23px;letter-spacing:-.5px}h2{font-size:14px;margin:0 0 14px}p{margin:5px 0;color:var(--muted)}.badge{color:var(--accent);background:#e9f0e8;padding:6px 12px;border-radius:20px;font-size:12px}.layout{max-width:1400px;margin:auto;padding:24px;display:grid;grid-template-columns:235px minmax(320px,1fr) 270px;gap:20px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.sub{font-size:12px;color:var(--muted)}.layer{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-bottom:5px;border:none;background:#f6f7f4}.layer.active{background:#e9f0e8;color:#245856;outline:1px solid #aac5be}.swatches{display:flex;flex-wrap:wrap;gap:7px}.swatch{width:28px;height:28px;padding:0;border:2px solid white;border-radius:7px;box-shadow:0 0 0 1px var(--line)}.swatch.active{outline:2px solid var(--ink);outline-offset:2px}.stage{min-height:480px;display:flex;justify-content:center;align-items:center;overflow:hidden;border-radius:10px;background:repeating-conic-gradient(#ecede8 0% 25%,#f7f7f1 0% 50%) 50%/20px 20px;padding:20px}.canvas-wrap{position:relative;max-width:100%;touch-action:none;line-height:0}canvas#art{image-rendering:pixelated;display:block;max-width:100%;touch-action:none}.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#263a4320 1px,transparent 1px),linear-gradient(to bottom,#263a4320 1px,transparent 1px)}.pose-strip{display:flex;gap:8px;overflow:auto;padding:14px 0 2px}.pose{flex:none;width:80px;padding:8px 3px;font-size:11px}.pose canvas{width:36px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 4px}.field{display:flex;align-items:center;justify-content:space-between;gap:8px}.field input[type=number]{width:76px}input[type=color]{width:36px;height:30px;border:0;background:transparent}.notice{padding:12px;border-radius:10px;background:#f4f6ed;font-size:12px;color:#687263}footer{max-width:1400px;margin:0 auto;padding:0 25px 25px;color:var(--muted);font-size:12px}#status{min-height:20px;color:var(--accent)}label{cursor:pointer}.full{width:100%}hr{border:0;border-top:1px solid var(--line);margin:5px 0}.danger{color:#aa4d3c} @media(max-width:1050px){.layout{grid-template-columns:200px minmax(280px,1fr)}.inspector{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:24px}.stage{min-height:420px}}@media(max-width:640px){header{padding:16px;gap:12px;align-items:flex-start}h1{font-size:19px}.layout{padding:12px;display:flex;flex-direction:column;gap:12px}.panel{padding:16px}.stage{min-height:350px}.inspector{display:block}.inspector>div{margin-bottom:20px}.badge{white-space:nowrap}footer{padding:0 16px 20px}}
</style></head><body><header><div><h1>像素角色工作台</h1><p>把造型与姿势分开打磨，保留每一次修改。</p></div><span id="phase" class="badge"></span></header><main class="layout"><aside class="panel stack"><div><h2>角色部件</h2><div id="layers"></div><p class="sub">下方部件覆盖上方部件。</p></div><hr><div><h2>调色板</h2><div id="palette" class="swatches"></div><div class="row" style="margin-top:14px"><input id="color" type="color" aria-label="修改选中颜色"><span id="color-key" class="sub"></span></div><p class="sub">调色会应用到所有姿势。</p></div><hr><div class="row"><button id="pen" class="active">画笔</button><button id="erase">橡皮</button><button id="undo">撤销</button></div><label class="sub"><input id="pose-only" type="checkbox" checked> 只修改当前姿势的像素</label><label class="sub"><input id="grid-toggle" type="checkbox" checked> 显示像素网格</label></aside><section class="panel"><div class="row spread" style="margin-bottom:16px"><div><h2 id="model-name" style="margin:0"></h2><span id="dimensions" class="sub"></span></div><div class="row"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label" class="sub"></span><button id="zoom-in" aria-label="放大">＋</button></div></div><div class="stage"><div class="canvas-wrap"><canvas id="art" aria-label="像素角色编辑画布"></canvas><div id="grid" class="grid"></div></div></div><div id="poses" class="pose-strip"></div><div class="row spread" style="margin-top:12px"><span id="status" role="status"></span><button id="duplicate">复制当前姿势</button></div></section><aside class="panel inspector"><div class="stack"><div><h2>当前部件</h2><p id="part-name"></p></div><label class="field">水平位移<input id="dx" type="number" min="-128" max="128" step="1"></label><label class="field">垂直位移<input id="dy" type="number" min="-128" max="128" step="1"></label><label><input id="visible" type="checkbox"> 显示这个部件</label><label><input id="flip" type="checkbox"> 水平翻转这个部件</label><hr><h2 style="margin-bottom:0">对齐基准</h2><label class="field">基准点<select id="anchor"><option value="foot">脚底</option><option value="grip">持物点</option></select></label><div class="row"><label>X <input id="anchor-x" type="number" min="-128" max="256" style="width:78px"></label><label>Y <input id="anchor-y" type="number" min="-128" max="256" style="width:78px"></label></div><p class="sub">替换人物时，用相同基准保持站位和持物位置。</p><div id="motion-controls" hidden><hr><h2>动作预览</h2><div class="row"><select id="action" aria-label="选择动作"></select><button id="play">播放</button></div><label class="field" style="margin-top:10px">当前帧时长（毫秒）<input id="duration" type="number" min="40" max="2000" step="10"></label></div></div><div class="stack" style="margin-top:24px"><h2 style="margin-bottom:0">保存与导出</h2><button id="save" class="primary full">保存可编辑数据</button><button id="png" class="full">导出当前姿势 PNG</button><button id="board" class="full">导出静态设计板</button><button id="sheet" class="full" hidden>导出动作精灵图</button><button id="load" class="full">导入角色数据</button><input id="file" type="file" accept=".json,application/json" hidden><div id="notice" class="notice"></div><span class="sub">保存和导出均不代表验收通过。请下载数据文件留存修改。</span></div></aside></main><footer>基础角色是原创构造示例。实际人物造型、动作自然度和故事效果仍需逐稿审看。</footer><script>/*__PIXEL_CONFIG__*/
/*__PIXEL_CORE__*/
/*__PIXEL_UI__*/</script></body></html>
